apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-api
  labels:
    app: redis-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-api
  template:
    metadata:
      labels:
        app: redis-api
    spec:
      containers:
      - name: api
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            python3 -c '
            import http.server, socketserver
            class Handler(http.server.SimpleHTTPRequestHandler):
                def do_GET(self):
                    self.send_response(200)
                    self.send_header("Content-type", "application/json")
                    self.end_headers()
                    self.wfile.write(b"{\"status\": \"ok\", \"service\": \"redis-api\"}")
            with socketserver.TCPServer(("", 5000), Handler) as httpd:
                httpd.serve_forever()
            '
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        ports:
        - containerPort: 5000
          name: http-api
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-api-service
spec:
  selector:
    app: redis-api
  ports:
  - port: 5000
    targetPort: 5000